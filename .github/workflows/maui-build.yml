name: AfroPhloem CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: afro-phloem-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies
        run: dotnet restore AfroPhloem.csproj

      - name: Build Android app
        run: >
          dotnet build AfroPhloem.csproj
          -f net10.0-android
          -c Release
          --no-restore