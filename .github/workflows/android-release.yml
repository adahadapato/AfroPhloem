
name: Phloem Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Create signed Android release packages
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android dependencies
        run: dotnet restore Phloem.csproj -p:TargetFramework=net10.0-android

      - name: Restore Android signing keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "ANDROID_KEYSTORE_BASE64 is missing."
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "phloem-upload.jks"

          $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($keystorePath, $bytes)

          "PHLOEM_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

          Write-Host "Android signing keystore restored."

      - name: Publish signed Android APK and AAB
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD)) {
            throw "ANDROID_KEYSTORE_PASSWORD is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:KEY_ALIAS)) {
            throw "ANDROID_KEY_ALIAS is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) {
            throw "ANDROID_KEY_PASSWORD is missing."
          }

          $arguments = @(
            "publish"
            "Phloem.csproj"
            "-f"
            "net10.0-android"
            "-c"
            "Release"
            "--no-restore"
            "-p:AndroidPackageFormats=aab%3Bapk"
            "-p:AndroidKeyStore=true"
            "-p:AndroidSigningKeyStore=$env:PHLOEM_KEYSTORE_PATH"
            "-p:AndroidSigningKeyAlias=$env:KEY_ALIAS"
            "-p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD"
            "-p:AndroidSigningKeyPass=env:KEY_PASSWORD"
          )

          & dotnet @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Android release publish failed."
          }

      - name: Locate and prepare release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Searching for generated Android packages..."

          $files = @(
            Get-ChildItem -Path "./bin/Release/net10.0-android" `
              -Recurse -File |
              Where-Object {
                $_.Extension -in ".apk", ".aab"
              }
          )

          if ($files.Count -eq 0) {
            throw "No APK or AAB files were generated."
          }

          $files |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          $apk = @(
            $files |
              Where-Object {
                $_.Extension -eq ".apk" -and
                $_.Name -match "Signed"
              }
          )

          $aab = @(
            $files |
              Where-Object {
                $_.Extension -eq ".aab" -and
                $_.Name -match "Signed"
              }
          )

          if ($apk.Count -ne 1) {
            throw "Expected exactly one signed APK; found $($apk.Count)."
          }

          if ($aab.Count -ne 1) {
            throw "Expected exactly one signed AAB; found $($aab.Count)."
          }

          New-Item -ItemType Directory `
            -Path "./release-output" -Force | Out-Null

          Copy-Item $apk[0].FullName `
            "./release-output/Phloem-Signed.apk"

          Copy-Item $aab[0].FullName `
            "./release-output/Phloem-Signed.aab"

          Write-Host "Release packages prepared successfully."

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Phloem-Signed-APK
          path: release-output/Phloem-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Phloem-Signed-AAB
          path: release-output/Phloem-Signed.aab
          if-no-files-found: error
          retention-days: 14
