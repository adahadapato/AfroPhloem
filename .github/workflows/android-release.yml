
name: Phloem Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Create signed Android release packages
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android dependencies
        run: dotnet restore Phloem.csproj -p:TargetFramework=net10.0-android

      - name: Restore Android signing keystore
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_BASE64)) {
            throw "ANDROID_KEYSTORE_BASE64 is missing."
          }

          $keystorePath = Join-Path $env:RUNNER_TEMP "phloem-upload.jks"

          $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
          [IO.File]::WriteAllBytes($keystorePath, $bytes)

          "PHLOEM_KEYSTORE_PATH=$keystorePath" >> $env:GITHUB_ENV

          Write-Host "Android signing keystore restored."

      - name: Publish signed Android APK and AAB
        shell: pwsh
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:KEYSTORE_PASSWORD)) {
            throw "ANDROID_KEYSTORE_PASSWORD is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:KEY_ALIAS)) {
            throw "ANDROID_KEY_ALIAS is missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:KEY_PASSWORD)) {
            throw "ANDROID_KEY_PASSWORD is missing."
          }

          $arguments = @(
            "publish"
            "Phloem.csproj"
            "-f"
            "net10.0-android"
            "-c"
            "Release"
            "--no-restore"
            "-p:AndroidPackageFormats=aab%3Bapk"
            "-p:AndroidKeyStore=true"
            "-p:AndroidSigningKeyStore=$env:PHLOEM_KEYSTORE_PATH"
            "-p:AndroidSigningKeyAlias=$env:KEY_ALIAS"
            "-p:AndroidSigningStorePass=env:KEYSTORE_PASSWORD"
            "-p:AndroidSigningKeyPass=env:KEY_PASSWORD"
          )

          & dotnet @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "Android release publish failed."
          }

      - name: Locate and prepare release packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $releaseDir = "./bin/Release/net10.0-android"
          $outputDir = "./release-output"

          Write-Host "Checking signed Android release packages..."

          $apkPath = Join-Path $releaseDir "com.zayun.phloem-Signed.apk"
          $aabPath = Join-Path $releaseDir "publish/com.zayun.phloem-Signed.aab"

          if (-not (Test-Path $apkPath -PathType Leaf)) {
            throw "Signed APK not found: $apkPath"
          }

          if (-not (Test-Path $aabPath -PathType Leaf)) {
            throw "Signed AAB not found: $aabPath"
          }

          New-Item -ItemType Directory `
            -Path $outputDir -Force | Out-Null

          Copy-Item $apkPath `
            (Join-Path $outputDir "Phloem-Signed.apk")

          Copy-Item $aabPath `
            (Join-Path $outputDir "Phloem-Signed.aab")

          Write-Host "Signed release packages prepared successfully."

          Get-ChildItem $outputDir |
            Select-Object Name, Length |
            Format-Table -AutoSize

      - name: Upload signed Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Phloem-Signed-APK
          path: release-output/Phloem-Signed.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: Phloem-Signed-AAB
          path: release-output/Phloem-Signed.aab
          if-no-files-found: error
          retention-days: 14
