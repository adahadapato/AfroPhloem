
name: Phloem Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Create Android release package
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore Android dependencies
        run: dotnet restore Phloem.csproj -p:TargetFramework=net10.0-android

      - name: Publish Android App Bundle
        run: >
          dotnet publish Phloem.csproj
          -f net10.0-android
          -c Release
          --no-restore
          -p:AndroidPackageFormats=aab

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Phloem-Android
          path: |
            **/bin/Release/net10.0-android/publish/*.aab
          if-no-files-found: error
          retention-days: 14
