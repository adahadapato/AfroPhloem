name: Phloem iOS build check

# Builds the iOS app on a GitHub Mac WITHOUT signing it (for the iPhone simulator), so iPhone-only build errors
# show up now, long before there's an Apple Developer membership. Nothing is installed or published.
#
# Mac minutes use the free Actions allowance faster than Windows ones, so it runs ONLY when you ask for it:
# push to development with [ios] anywhere in the commit message, e.g.
#     git commit -m "Shipment details tweaks [ios]"
# (Other development pushes skip it. The "Run workflow" button would need this file on the default branch.)
#
# When the Apple Developer membership is in place, a separate ios-release.yml will build a SIGNED app and send it
# to TestFlight.

on:
  push:
    branches:
      - development

  workflow_dispatch:

concurrency:
  group: phloem-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-latest

    # Only when the commit message asks for it (or when started by hand)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use the newest stable Xcode on the runner
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET and Xcode information
        run: |
          dotnet --info
          xcodebuild -version

      - name: Install .NET MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore iOS dependencies
        run: dotnet restore Phloem.csproj -p:TargetFramework=net10.0-ios

      # The simulator build needs no certificate or provisioning profile
      - name: Build iOS app (simulator)
        run: >
          dotnet build Phloem.csproj
          -f net10.0-ios
          -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
          --no-restore